<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — Mayha Courts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./admin.css"></head>
<body><header><a href="./index.html" class="brand"><img src="./mayha-square-logo.png" alt="Mayha Square Pickleball Court">MAYHA <b>COURTS</b></a><div class="account"><span id="admin-email"></span><button id="sign-out">Sign out</button></div></header>
<main><section id="loading" class="state"><div class="spinner"></div><p>Checking administrator access…</p></section><section id="denied" class="state hidden"><p class="eyebrow">ACCESS RESTRICTED</p><h1>This page is for staff.</h1><p>Your signed-in account has not been added as an administrator yet.</p><a href="./index.html" class="button">Back to bookings</a></section><section id="dashboard" class="hidden"><div class="heading"><div><p class="eyebrow">COURT OPERATIONS</p><h1>Today’s game plan.</h1></div><button id="refresh" class="outline">Refresh</button></div><div class="metrics"><article><span>Today’s bookings</span><strong id="today-count">0</strong></article><article><span>Confirmed</span><strong id="confirmed-count">0</strong></article><article><span>Checked in</span><strong id="checkin-count">0</strong></article><article><span>Cancelled</span><strong id="cancelled-count">0</strong></article></div><div class="controls"><label>DATE <input type="date" id="filter-date"></label><label>STATUS <select id="filter-status"><option value="all">All statuses</option><option value="confirmed">Confirmed</option><option value="checked_in">Checked in</option><option value="cancelled">Cancelled</option><option value="no_show">No show</option></select></label></div><section class="schedule"><div class="schedule-title"><h2>Bookings</h2><span id="booking-count"></span></div><div id="booking-list" class="booking-list"></div></section></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="./admin.js"></script></body></html>
